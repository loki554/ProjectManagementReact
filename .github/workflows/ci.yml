# Сборка и тесты обеих половин монорепо (8.7 IMPROVEMENTS.md).
#
# До этого файла CI не было вообще: всё, что защищало main, — это дисциплина запускать
# тесты локально. Пороги покрытия из 2.7 при этом уже стояли в pom и ждали того, кто их
# будет проверять; здесь они наконец проверяются.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Отменяем предыдущий прогон на той же ветке: три пуша подряд не должны занимать раннеры
# сборками, результат которых уже никому не нужен. main исключён из отмены — там каждый
# коммит хочется видеть проверенным отдельно.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          # Кэш ~/.m2 — иначе каждый прогон заново тянет полдерева Spring Boot.
          cache: maven

      # verify, а не test: на этой фазе висят ворота JaCoCo (2.7), а без них прогон
      # проверял бы только «компилируется и тесты зелёные», но не то, что покрытие
      # сервисов не съехало вниз.
      #
      # Testcontainers поднимает настоящую Postgres 16 и MinIO — на ubuntu-latest docker
      # уже есть, ставить ничего не нужно. Это же и делает прогон небыстрым (несколько
      # минут), и это осознанная плата: тесты идут в ту же БД, что и прод, а не в H2.
      - name: mvnw verify
        working-directory: project-management-backend
        run: ./mvnw -B -ntp verify

      # Отчёт JaCoCo складываем артефактом: когда ворота покрытия падают, первый вопрос —
      # «а где именно просело», и лезть за ответом в лог прогона бессмысленно.
      - name: JaCoCo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: project-management-backend/target/site/jacoco/
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project-management-react
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: project-management-react/package-lock.json

      # ci, а не install: ставит ровно то, что в lock-файле, и падает при расхождении с
      # package.json. Расхождение — это как раз то, что должен ловить CI, а не молча чинить.
      - run: npm ci

      - run: npm run lint

      # Юнит-тесты (vitest). E2E (playwright) здесь намеренно нет: они требуют поднятого
      # стека с БД и MailHog, и это отдельный прогон — см. комментарий в конце файла.
      - run: npm test

      # Сборка в конце: она ловит то, чего не видят ни линтер, ни тесты, — сломанный
      # импорт в ветке, куда ни один тест не заходит.
      - run: npm run build

  # Образы собираются на каждом PR, но никуда не пушатся. Смысл именно в проверке: оба
  # Dockerfile'а легко сломать правкой, которая ничего не ломает локально (новый файл не
  # попал в COPY, изменился путь), и узнавать об этом в момент выката не хочется.
  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: build backend image
        run: docker build -t pmtracker-backend:ci ./project-management-backend

      - name: build frontend image
        run: docker build -t pmtracker-frontend:ci ./project-management-react

      # Проверяем то, на что опирается docker-compose.prod.yml: контейнеры работают не от
      # root. Строчка дешёвая, а регрессия («добавил USER root, чтобы починить права»)
      # ровно такая, которую никто не замечает в ревью.
      # --entrypoint нужен обоим: у образов свой ENTRYPOINT, и без подмены аргументы
      # уедут приложению, а не команде id — проверка молча проверяла бы не то.
      - name: containers must not run as root
        run: |
          test "$(docker run --rm --entrypoint id pmtracker-backend:ci -u)" != "0"
          test "$(docker run --rm --entrypoint id pmtracker-frontend:ci -u)" != "0"

# Чего здесь нет и почему:
#   E2E (project-management-react/e2e, playwright) — им нужен поднятый стек: Postgres,
#   MailHog и оба приложения. Завести это в CI можно (services: в job или
#   docker-compose.prod.yml), но набор упирается в лимит регистраций: весь прогон проходит
#   раз в час, второй подряд падает на 429 и лечится перезапуском бэкенда. Пока лимит не
#   разведён на тестовый профиль, E2E в CI будут красными через раз — то есть бесполезными.
