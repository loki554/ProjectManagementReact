# Раздача собранного SPA и проксирование API (8.8 IMPROVEMENTS.md).
# Едет в контейнер как /etc/nginx/conf.d/default.conf (см. Dockerfile), то есть попадает
# в http-контекст стандартного nginx.conf образа — отсюда map ниже и gzip внутри server.
#
# Топология, под которую написан файл: nginx отдаёт статику и он же проксирует /api/ на
# бэкенд. Один origin для фронта и API — это не только «меньше настроек»: исчезает CORS
# (preflight, exposed-headers, список разрешённых origin), а CSP сводится к connect-src 'self'.
# Разнести их по разным доменам можно, но тогда надо вернуть CORS на бэкенде и дописать
# origin бэкенда в connect-src (см. security-headers.conf).
#
# TLS здесь НЕ терминируется: предполагается, что перед контейнером стоит то, что умеет
# ACME (Caddy/Traefik/облачный балансировщик). Поэтому слушаем обычный http и доверяем
# X-Forwarded-Proto от того, кто стоит впереди.

# Протокол, который видел клиент. Если впереди TLS-терминатор — он придёт в заголовке;
# если nginx работает без него (локальная проверка образа) — берём собственную схему.
map $http_x_forwarded_proto $client_proto {
    default $scheme;
    ~.      $http_x_forwarded_proto;
}

upstream backend {
    # Имя сервиса из docker-compose.prod.yml. keepalive — чтобы на каждый запрос SPA не
    # открывалось новое TCP-соединение к бэкенду; без него заметная часть латентности
    # уходит в рукопожатия на ровном месте.
    server backend:8080;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Порт 8080, а не 80: образ запускается от непривилегированного пользователя (см.
    # Dockerfile), а порты ниже 1024 ему недоступны. Наружу это всё равно 80/443 у прокси.

    # Версию nginx в заголовке Server показывать незачем — это подсказка для подбора CVE.
    server_tokens off;

    # Вложения к задачам — до 20MB (spring.servlet.multipart.max-file-size). Дефолт nginx
    # это 1m, то есть без этой строки загрузка файла падала бы на 413 ещё до бэкенда,
    # и выглядело бы это как сломанная функция, а не как настройка прокси. 21m — запас
    # на multipart-обвязку вокруг самого файла.
    client_max_body_size 21m;

    # Точка расширения на уровне server (8.9 IMPROVEMENTS.md): сюда staging подкладывает
    # basic-auth, чтобы непубличный стенд не был публичным. Именно server-уровень, а не
    # location: auth_basic наследуется вниз и закрывает всё разом, включая /api/ — иначе
    # закрытой оказалась бы страница, но не данные за ней.
    # Пустой glob для nginx не ошибка, так что в проде каталог просто пуст.
    include /etc/nginx/snippets/environment/server-*.conf;

    # --- сжатие ---------------------------------------------------------------------
    # text/html сжимается всегда и в gzip_types не указывается (nginx ругается на дубль).
    # Уже сжатые форматы (png/jpg/woff2) в список не попали намеренно: их пережатие
    # тратит CPU и не даёт ничего.
    #
    # Brotli в стандартном образе nginx нет — он требует ngx_brotli, то есть сборки nginx
    # из исходников. На наших объёмах разница с gzip -6 это единицы процентов, и платить
    # за неё кастомным образом (который потом надо самим пересобирать под каждый CVE)
    # не стоит. Если статику вынесут на CDN, brotli появится там сам собой.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # --- API ------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $client_proto;
        proxy_set_header X-Forwarded-Host $host;
        # ПЕРЕЗАПИСЫВАЕМ, а не дописываем ($proxy_add_x_forwarded_for). Бэкенд включает
        # server.forward-headers-strategy и берёт из этого заголовка адрес клиента для
        # rate limiting (1.1) — а значит подделанный клиентом X-Forwarded-For обошёл бы
        # лимиты входа. Перезапись здесь и есть то предусловие, о котором написано в
        # application-prod.yml.
        # Если перед этим nginx появится ещё один доверенный прокси, менять надо ОБА
        # места сразу: здесь на $proxy_add_x_forwarded_for, а в Spring — список доверенных.
        proxy_set_header X-Forwarded-For $remote_addr;

        # Таймауты: бэкенд может думать долго на выгрузке отчёта (4.10), но не бесконечно.
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Живые обновления (4.15) — поток SSE, и обычные настройки прокси его ломают.
    # Отдельным location, потому что послабления ниже нужны ровно здесь и больше нигде.
    location = /api/realtime/stream {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $client_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;

        # Без этого nginx копит ответ в буфере и отдаёт его целиком — то есть события
        # доезжают до браузера пачкой в конце потока, когда они уже никому не нужны.
        proxy_buffering off;
        proxy_cache off;

        # Соединение живёт app.realtime.stream-ttl (по умолчанию 10 минут), после чего
        # клиент переподключается сам. proxy_read_timeout обязан быть заметно больше,
        # иначе разрывать поток будет nginx — и делать это раньше, чем клиент к этому
        # готов. 15 минут — ttl плюс запас.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # --- статика --------------------------------------------------------------------
    # Хешированные ассеты Vite (app-a1b2c3d4.js): имя меняется при любом изменении
    # содержимого, поэтому кешируются навсегда. immutable — чтобы браузер не ходил
    # перепроверять их даже при обновлении страницы.
    #
    # try_files ... =404, а НЕ фолбэк на index.html. Это важно с тех пор, как появилось
    # разделение бандла (5.4): пропавший чанк должен честно отдать 404, который приложение
    # обработает переподгрузкой. С фолбэком браузер получил бы на запрос .js HTML-страницу
    # со статусом 200, и ошибка выглядела бы как невнятный SyntaxError в консоли.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # index.html не хеширован и обязан перечитываться: именно он содержит ссылки на новые
    # хеши после выката. no-cache здесь означает не «не кешировать», а «кешируй, но каждый
    # раз спрашивай» — то есть 304 в обычной жизни и новая версия сразу после деплоя.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # SPA-фолбэк: маршрутизацией владеет react-router, и прямой заход на /projects/42
    # или перезагрузка такой страницы должны отдать приложение, а не 404 nginx.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Собственный healthcheck раздачи — отдельно от бэкендовского /actuator/health (8.6):
    # он отвечает на другой вопрос («жив ли nginx и есть ли что раздавать»), и заворачивать
    # его на бэкенд значит перезапускать контейнер фронта из-за проблем с базой.
    location = /healthz {
        # auth_basic off стоит здесь безусловно, хотя в проде никакого auth_basic и нет:
        # на staging он появляется на уровне server (8.9), а проба контейнера ходит без
        # учётных данных — то есть за забором стенда фронтенд числился бы unhealthy вечно.
        # Строчка в проде не делает ничего, а на стенде избавляет от отдельного location,
        # который конфликтовал бы с этим по имени.
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
