# Заголовки безопасности для раздачи SPA (8.8 + фронтовая половина 1.5 IMPROVEMENTS.md).
#
# Отдельным файлом, а не строчками в server{}, из-за правила наследования nginx: add_header
# наследуется в location ТОЛЬКО пока в самом location нет ни одного своего add_header. У нас
# они есть почти везде (Cache-Control), то есть заголовки безопасности молча исчезли бы
# ровно с тех ответов, ради которых всё и затевалось — со скриптами и с index.html.
# Поэтому: include в каждом location, где есть свой add_header.
#
# always у каждого заголовка — тоже не украшение: без него add_header не срабатывает на
# ответах с кодом ошибки, и страница 404/500 уезжала бы без CSP.

# CSP самого SPA. Отличается от CSP бэкенда (там default-src 'none', см. SecurityConfig):
# здесь браузер реально исполняет наш бандл.
#   script-src 'self'          — Vite собирает всё в файлы, инлайновых скриптов в index.html нет;
#                                'unsafe-inline'/'unsafe-eval' не нужны и не даются.
#   style-src  'unsafe-inline' — вынужденно: Tailwind отдаёт статикой, но редактор Markdown
#                                (@uiw/react-md-editor) и подсветка кода ставят inline-стили.
#                                Без этого половина редактора едет без оформления.
#   img-src    https: data: blob:
#                              — вынужденно и осознанно: приложение рендерит пользовательский
#                                Markdown, где картинка по внешней ссылке — обычное дело.
#                                Ограничить до 'self' значит сломать описания задач и wiki.
#                                Картинка — не скрипт; худшее, что она даёт, это утечка факта
#                                открытия страницы на чужой хост (Referrer-Policy ниже этот
#                                след обрезает). blob: нужен превью загружаемого файла.
#   connect-src 'self'         — API проксируется этим же nginx на /api/, то есть тот же origin.
#                                При разнесении фронта и бэкенда по разным доменам сюда надо
#                                дописать origin бэкенда, иначе SPA не сможет с ним говорить.
#   frame-ancestors 'none'     — clickjacking, второй рубеж к X-Frame-Options ниже.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# В URL приложения лежат id проектов и задач — чужому сайту в Referer им незачем.
# Заодно это обрезает след от внешних картинок, разрешённых в img-src выше.
add_header Referrer-Policy "no-referrer" always;

# Приложению не нужна ни одна из этих возможностей браузера — забираем их у страницы
# целиком, чтобы даже успешная XSS не смогла попросить камеру или геолокацию.
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;

# HSTS. Браузер игнорирует его на http-ответах, так что отдавать безусловно безопасно —
# сработает он ровно тогда, когда перед контейнером встанет TLS. Значение то же, что у
# бэкенда (SecurityConfig): год + поддомены, с таким принимают в preload-список.
# ВНИМАНИЕ: includeSubDomains распространяется на ВСЕ поддомены домена — если на соседнем
# живёт что-то без сертификата, оно станет недоступно. Это не повод убирать заголовок,
# это повод проверить соседей до первого выката.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Точка расширения для нестандартных стендов (8.9 IMPROVEMENTS.md): staging добавляет сюда
# X-Robots-Tag. Именно внутри этого файла, а не на уровне server, и по той же причине, что
# описана в его шапке: add_header с уровня server не наследуется в location, у которого
# есть свой add_header, — то есть noindex не доехал бы ровно до тех ответов, которые и
# индексируются. Пустой glob для nginx не ошибка, в проде каталог пуст.
include /etc/nginx/snippets/environment/headers-*.conf;
