# Заголовок для стенда (8.9 IMPROVEMENTS.md). Подкладывается в контейнер фронтенда только
# на staging: docker-compose.staging.yml монтирует его в /etc/nginx/snippets/environment/.
#
# Зачем: стенд живёт на отдельном домене, и поисковик, найдя его по ссылке из письма или по
# сертификату в Certificate Transparency, проиндексирует его наравне с продом. Дальше это
# либо дубли в выдаче, либо, что хуже, выдача с тестовыми данными по запросу с названием
# продукта. robots.txt здесь не помощник: он просит не сканировать, но уже попавшую в индекс
# страницу не убирает, — а X-Robots-Tag работает как директива на каждом ответе.
add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
