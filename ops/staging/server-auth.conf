# Basic-auth на весь стенд (8.9 IMPROVEMENTS.md). Монтируется только на staging.
#
# Это не защита данных, а забор от случайных посетителей: стенд с тестовыми данными,
# открытый в интернет, рано или поздно найдут — и заведут там аккаунт, и напишут в
# поддержку про «сломанный продукт». Пароль общий на стенд, лежит в htpasswd рядом.
#
# auth_basic на уровне server, а не в location: так закрывается и /api/ тоже. Закрытая
# страница при открытом API — это не закрытый стенд. Единственное исключение — /healthz,
# у которого auth_basic off прописан в самом default.conf: проба ходит без учётных данных.
auth_basic "staging";
auth_basic_user_file /etc/nginx/snippets/environment/htpasswd;
