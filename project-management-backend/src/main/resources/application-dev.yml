spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/pmtracker
    username: pmtracker
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: localhost
    port: 1025
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

# Swagger UI живёт только в dev (в application.properties springdoc выключен по умолчанию).
# Здесь же ослабленный CSP: строгий default-src 'none' из application.properties не дал бы
# самой странице Swagger загрузить свои скрипты и стили. Внешние источники не разрешены и
# тут — только 'self' и inline, без которого swagger-ui не работает.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  security:
    content-security-policy: >-
      default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline';
      script-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self';
      frame-ancestors 'none'; base-uri 'self'; form-action 'self'
  storage:
    # local (по умолчанию) — файлы на диске инстанса; s3 — объектное хранилище (3.7).
    # Локально s3 проверяется против MinIO из docker-compose: раскомментировать блок ниже,
    # завести бакет в консоли http://localhost:9001 и перезапустить бэкенд.
    #   type: s3
    #   s3:
    #     bucket: pmtracker
    #     endpoint: http://localhost:9000
    #     access-key: ${MINIO_ROOT_USER}
    #     secret-key: ${MINIO_ROOT_PASSWORD}
    #     path-style-access: true
    type: local
    base-path: ./storage
  frontend:
    base-url: http://localhost:5173
  # Email-уведомления (4.3). Настройками владеет пользователь (профиль → уведомления),
  # здесь — только расписание суточной сводки для тех, кто выбрал режим DAILY_DIGEST.
  # По умолчанию 9:00 по часовому поясу процесса; чистки при этом стоят ночью (3:30–4:15),
  # и разводить их с рассылкой имеет смысл не только по нагрузке: письмо приходит к началу
  # рабочего дня, а не к четырём утра.
  notifications:
    digest:
      cron: "0 0 9 * * *"
  # Живые обновления через SSE (4.15). Значения по умолчанию заданы в коде, здесь — только
  # точки переопределения:
  #   stream-ttl  сколько живёт одно соединение, после чего клиент переподключается
  #               (по умолчанию 10 минут — намеренно меньше времени жизни access-токена,
  #               см. RealtimeConnectionRegistry);
  #   heartbeat   как часто в открытый поток уходит пустой кадр, чтобы прокси не счёл
  #               соединение мёртвым (по умолчанию 25 секунд — с запасом под стандартный
  #               proxy_read_timeout nginx в 60 секунд).
  # ВАЖНО для прода: перед бэкендом почти наверняка стоит nginx, а он по умолчанию буферизует
  # ответ — то есть события копятся в буфере вместо того, чтобы уходить в браузер. Для
  # /api/realtime/ нужен proxy_buffering off (и proxy_read_timeout больше, чем stream-ttl).
  realtime:
    heartbeat: PT25S
  # Кэш проверки членства в проекте (3.10). Выключен по умолчанию и осознанно: это кэш
  # авторизационного решения, то есть окно, в котором исключённый участник ещё считается
  # участником, и включать его, не измерив выигрыш, значит платить риском ни за что.
  # Явная инвалидация на приглашение, смену роли, исключение и удаление проекта работает
  # независимо от TTL, так что окно закрывается сразу — TTL остаётся страховкой.
  #   enabled  включить (по умолчанию false)
  #   ttl      время жизни записи (по умолчанию 1 минута)
  #   max-size потолок числа записей (по умолчанию 10000)
  cache:
    membership:
      enabled: false
  # Лимиты auth-эндпоинтов (RateLimitProperties): значения по умолчанию заданы в коде,
  # чтобы защита работала в любом профиле, здесь — только точки переопределения.
  # По умолчанию: login 5/15m на (IP, email) и 20/15m на IP, register 20/1h на IP,
  # register 5/1h на email, resend-verification 3/1h на email и 10/1h на IP, refresh 60/15m на IP,
  # forgot-password 3/1h на email и 10/1h на IP, reset-password 20/1h на IP.
  # Если лимит мешает локальной отладке — app.rate-limit.enabled: false (только в dev!)
  # или, точечно, например app.rate-limit.login.capacity: 100
  rate-limit:
    enabled: true

  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-please-override-in-prod-min-32-bytes!}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 14
