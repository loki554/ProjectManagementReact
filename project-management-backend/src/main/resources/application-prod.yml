# Прод-профиль. Включается только снаружи: SPRING_PROFILES_ACTIVE=prod (см. application.properties).
#
# Главное правило файла: НИ ОДНОГО дефолта у секретов и адресов окружения. Placeholder без
# fallback (${VAR}) роняет контекст на старте с "Could not resolve placeholder", и это
# осознанный выбор: приложение, молча поднявшееся с dev-датасорсом или публично известным
# JWT-секретом, опаснее не поднявшегося вовсе.
#
# Обязательные переменные окружения:
#   DB_URL              jdbc:postgresql://<host>:5432/<db>
#   DB_USERNAME         пользователь БД
#   DB_PASSWORD         пароль БД
#   MAIL_HOST           SMTP-релей
#   MAIL_PORT           порт SMTP (обычно 587 для STARTTLS)
#   MAIL_USERNAME       логин SMTP
#   MAIL_PASSWORD       пароль SMTP
#   JWT_SECRET          случайные >= 32 байта; проверяется в JwtService (см. 1.2)
#   FRONTEND_BASE_URL   https://<домен фронта>; идёт и в CORS (SecurityConfig), и в ссылки писем
#   STORAGE_BASE_PATH   каталог для вложений и аватарок; должен переживать перезапуск
#                       контейнера. Не нужен только при STORAGE_TYPE=s3 (см. app.storage ниже);
#                       при local его отсутствие роняет старт, а не подставляет рабочий каталог

# Swagger/OpenAPI здесь намеренно не включаются: в application.properties springdoc выключен
# по умолчанию, а включает его только dev. Пути /v3/api-docs/** и /swagger-ui/** при этом ещё и
# выпадают из permitAll (SecurityConfig смотрит на тот же флаг), то есть отдают 401, а не карту API.

server:
  # Прод разворачивается за TLS-терминирующим прокси, а значит без разбора X-Forwarded-*
  # приложение видит http и адрес самого прокси. Отсюда две поломки: Spring Security считает
  # запрос незащищённым и не пишет HSTS вообще, а лимитер auth-эндпоинтов склеивает всех
  # клиентов в один ключ по адресу прокси.
  # ПРЕДУСЛОВИЕ: приложение доступно ТОЛЬКО через этот прокси, и прокси перезаписывает
  # X-Forwarded-For сам. Если приложение смотрит в интернет напрямую — строку надо убрать,
  # иначе клиент подделает X-Forwarded-For и обойдёт rate limiting.
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Пул намеренно небольшой: узкое место — не приложение, а сама Postgres (её
      # max_connections делится на все инстансы). Таймауты заданы явно, чтобы запрос,
      # упёршийся в исчерпанный пул или зависшую сеть, падал быстро и с внятной ошибкой,
      # а не держал поток Tomcat до бесконечности.
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      validation-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 900000
  jpa:
    hibernate:
      # Схемой владеет Flyway; ddl-auto здесь только сверяет её с маппингом и падает при
      # расхождении. Ничего, кроме validate, в проде допустимым не является.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      # required, а не только enable: без этого при отсутствии STARTTLS у сервера письмо
      # (со ссылкой подтверждения внутри) молча уйдёт открытым текстом.
      mail.smtp.starttls.required: true
      # Таймауты SMTP здесь не дублируются: они заданы для всех профилей сразу
      # в application.properties (spring.mail.properties.mail.smtp.*timeout).

app:
  storage:
    # local — файлы на диске инстанса, s3 — объектное хранилище (3.7). Дефолт остаётся
    # local, потому что менять способ хранения молча, самим фактом выката, нельзя: файлы,
    # уже лежащие на диске, в бакете не появятся.
    #
    # Для local обязателен STORAGE_BASE_PATH, и каталог обязан переживать перезапуск
    # контейнера. Локальный диск в проде годится ровно для одного инстанса: второй не
    # увидит чужих вложений, см. S3FileStorageService.
    #
    # Для s3 (STORAGE_TYPE=s3) обязателен S3_BUCKET; остальное — по обстоятельствам:
    #   S3_REGION            регион бакета (по умолчанию us-east-1)
    #   S3_ENDPOINT          адрес не-AWS хранилища (MinIO, Ceph, Yandex/VK Object Storage);
    #                        пусто для настоящего AWS
    #   S3_ACCESS_KEY/SECRET ключи; НЕ задавать при работе под IAM-ролью инстанса — тогда
    #                        SDK возьмёт временные учётные данные сам, и в конфиге не будет
    #                        долгоживущего секрета
    #   S3_PATH_STYLE        true для MinIO и большинства не-AWS реализаций
    #   S3_PRESIGNED         true отдаёт вложения редиректом прямо в хранилище; включать
    #                        только после того, как в CORS бакета разрешён origin фронтенда
    type: ${STORAGE_TYPE:local}
    base-path: ${STORAGE_BASE_PATH:}
    s3:
      bucket: ${S3_BUCKET:}
      region: ${S3_REGION:}
      endpoint: ${S3_ENDPOINT:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      path-style-access: ${S3_PATH_STYLE:false}
      presigned-downloads: ${S3_PRESIGNED:false}
  frontend:
    base-url: ${FRONTEND_BASE_URL}
  rate-limit:
    # Дефолты лимитов живут в RateLimitProperties; здесь важно только то, что выключить
    # их в проде нельзя (в dev это допустимо для отладки).
    enabled: true
  jwt:
    secret: ${JWT_SECRET}
    # Значения продублированы из dev не «на всякий случай»: JwtProperties — примитивные int,
    # и без них TTL стали бы нулевыми молча, то есть каждый выданный токен был бы уже истёкшим.
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 14
