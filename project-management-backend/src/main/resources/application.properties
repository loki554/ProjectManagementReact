spring.application.name=project-management-backend

# spring.profiles.active здесь СОЗНАТЕЛЬНО не задан: этот файл попадает в jar, и любой
# зашитый профиль стал бы профилем по умолчанию везде, включая прод (dev-датасорс на
# localhost, MailHog, dev-секрет JWT). Профиль задаётся снаружи при запуске:
#   прод/стейдж:  SPRING_PROFILES_ACTIVE=prod java -jar app.jar
#   локально:     ./mvnw initialize spring-boot:run  (профиль dev подставляет pom.xml,
#                 см. spring-boot.run.profiles; переопределяется -Dspring-boot.run.profiles=...)
# Без профиля приложение не поднимется вообще: без датасорса, почты и JWT-секрета
# контекст падает на старте — это и есть желаемое поведение, лучше чем тихий dev в проде.

# Spring не умеет ограничивать multipart per-endpoint, поэтому глобальный лимит взят по
# наибольшему потребителю — вложениям к задачам (Phase 7, 20MB, см. AttachmentService).
# Аватарка (Phase 2) ограничена более строгим лимитом (5MB) явной проверкой в UserService,
# а не глобальной настройкой — иначе она бы тоже расширилась до 20MB.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Таймауты SMTP заданы глобально, а не в одном prod-профиле: отправка писем ушла в фоновый пул
# (VerificationMailDispatcher), но пул этот небольшой, и без таймаутов один недоступный SMTP
# занимает его потоки до упора, после чего очередь переполняется и письма начинают теряться.
# Значения одинаковы для всех профилей; переопределить можно в профиле, как и любое свойство.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Swagger/OpenAPI выключены по умолчанию и включаются только там, где явно нужны
# (application-dev.yml). Обратный порядок — «включено везде, выключить в проде» — уже один раз
# оставил бы полную карту API открытой наружу: забыть выключить легко, забыть включить в dev
# видно сразу. Тот же флаг решает, отдавать ли пути документации без токена (см. SecurityConfig).
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# CSP по умолчанию — для JSON-API, которому не нужен ни один внешний ресурс: если ответ
# бэкенда всё же окажется отрисован браузером (аватарка-SVG, открытая по прямой ссылке,
# страница ошибки), выполнять в нём будет нечего. frame-ancestors закрывает clickjacking
# и для браузеров, которые уже не смотрят на X-Frame-Options. Профили, отдающие HTML
# (dev со Swagger UI), переопределяют это значение у себя.
app.security.content-security-policy=default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'

# --- Actuator: только health и info (8.6 IMPROVEMENTS.md) ---
#
# Два уровня запрета, и оба нужны. exposure.include говорит, какие эндпоинты вообще
# появляются на HTTP; access.default=none закрывает их ещё и по доступу, включая JMX и всё,
# что кто-нибудь добавит следующей строкой. Разрешение выдаётся поимённо и только read-only:
# у health есть POST-подобные операции (shutdown — отдельный эндпоинт, но принцип тот же),
# и «только чтение» здесь не ограничение, а описание того, что нам от actuator нужно.
management.endpoints.access.default=none
management.endpoints.web.exposure.include=health,info
management.endpoint.health.access=read-only
management.endpoint.info.access=read-only

# Liveness и readiness — разные вопросы, и путать их дорого.
#   /actuator/health/liveness   «процесс жив?» — только состояние самого приложения.
#                               Недоступная БД сюда НЕ входит сознательно: liveness-проба,
#                               ставшая красной, means «перезапусти контейнер», а перезапуск
#                               не чинит чужую базу — он только добавляет к аварии ещё и
#                               бесконечный CrashLoopBackOff.
#   /actuator/health/readiness  «можно слать трафик?» — сюда db добавлена: без базы каждый
#                               запрос всё равно закончится 500, и честнее выпасть из
#                               ротации. Цена решения: при недоступной БД из ротации выпадут
#                               ВСЕ инстансы сразу. Для одного инстанса это ровно то же самое,
#                               что и сейчас; когда инстансов станет больше — перечитать.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# Наружу отдаём только слово UP/DOWN: разбор по компонентам — это карта инфраструктуры
# (какая БД, сколько места на диске), а проба оркестратора смотрит на HTTP-статус и деталей
# не читает. В dev включено обратно (application-dev.yml), там это удобно и безопасно.
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# SMTP из health исключён намеренно. Отправка писем асинхронная (VerificationMailDispatcher),
# приложение переживает недоступный релей без потери основной функции — а вот индикатор mail
# на каждую пробу открывает соединение с SMTP, и недоступный релей превратил бы health в
# медленный запрос с таймаутом и вывел бы инстанс из ротации из-за некритичной подсистемы.
management.health.mail.enabled=false

# /info собирается только из build-info.properties (версия, время сборки, см. pom.xml).
# Переменные окружения в него не подмешиваем: там пароль БД и JWT_SECRET.
management.info.env.enabled=false
