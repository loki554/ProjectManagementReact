# Профиль интеграционных тестов. Отдельный, а не dev: тесты не должны зависеть от того,
# поднят ли на машине docker-compose и лежит ли рядом .env с DB_PASSWORD, — раньше
# ./mvnw test падал на "password authentication failed", то есть выглядел как сломанное
# приложение, хотя тестам просто не доехал пароль от локальной базы.
#
# Двух свойств здесь намеренно нет:
#   spring.datasource.*  — подставляет @ServiceConnection над PostgreSQLContainer,
#   spring.mail.host/port — @DynamicPropertySource с портом GreenMail.
# Оба адреса известны только в рантайме, и прописать их в файл нечем (см. IntegrationTest).

spring:
  jpa:
    hibernate:
      # Схемой владеет Flyway — ровно как в dev и проде. Ради тестов это не только
      # правильно, но и полезно: каждый прогон накатывает миграции на пустую базу,
      # то есть заодно проверяет их (см. комментарий к testcontainers в pom.xml).
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

app:
  notifications:
    digest:
      # 29 февраля в невисокосный год не наступает никогда — то есть по расписанию сводка в
      # тестах не уходит вовсе. Причина та же, что у due-scan ниже: тест дёргает
      # NotificationDigestJob.sendDigests() руками и проверяет, что отправил именно этот
      # прогон, а фоновый тик посреди прогона разослал бы письма, которых тест не ждёт.
      cron: "0 0 0 29 2 *"
    due-scan:
      # Сканирование дедлайнов в тестах запускается вручную (NotificationScheduler.checkDueDates),
      # а не по расписанию: тесты проверяют, что создал конкретный прогон, и фоновый тик посреди
      # прогона ломал бы ровно эти проверки — он и создавал бы уведомления, которых тест не ждёт,
      # и восстанавливал бы удалённые (см. clearDueDateAlerts). Сутки — это «не наступит никогда»
      # в масштабе тест-рана; полностью выключить @Scheduled точечно нечем.
      initial-delay-ms: 86400000
  realtime:
    # Heartbeat живых обновлений (4.15) в тестах не тикает: тест читает сам поток, и
    # комментарий-ping, прилетевший в него посреди проверки, — это лишняя строка ровно в
    # том месте, где сравнивается содержимое. Тест дёргает RealtimeConnectionRegistry.heartbeat()
    # руками, как и сканер дедлайнов ниже, и по той же причине. Сутки — это «не наступит
    # никогда» в масштабе тест-рана.
    heartbeat: PT24H
  storage:
    # Никакой тест сюда пока не пишет, но LocalFileStorageService требует свойство на старте.
    base-path: ${java.io.tmpdir}/pmtracker-integration-test-storage
  frontend:
    # Уезжает в ссылки писем (SmtpMailService) и в CORS (SecurityConfig). Тесты разбирают
    # ссылку из письма, поэтому значение должно быть предсказуемым, а не пустым.
    base-url: http://localhost:5173
  rate-limit:
    # Выключен сознательно. Тесты бьют по /login и /register десятки раз с одного адреса
    # и с одним и тем же email, то есть при включённом лимитере ловили бы 429 в зависимости
    # от порядка выполнения — самая неприятная разновидность плавающего теста. Сам лимитер
    # проверяется отдельно (это про частоту запросов, а не про auth-флоу).
    enabled: false
  jwt:
    # Свой секрет, не dev-дефолт: JwtService специально роняет контекст, если вне профиля dev
    # используется секрет из репозитория (см. его validateSecret).
    secret: integration-test-only-secret-do-not-use-anywhere-else-32b+
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 14
